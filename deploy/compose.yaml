# One fixed project owns the only production queue. Use the release scripts on hosts.
x-common: &common
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 64
  logging:
    driver: local
    options:
      max-size: "10m"
      max-file: "3"

services:
  caddy:
    <<: *common
    image: ${ART_EDGE_IMAGE:-singular-seed-edge:development}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: edge
      args:
        REVISION: ${ART_REVISION:-development}
    environment:
      ART_DOMAIN: ${ART_DOMAIN:?Set the canonical Caddy site address}
    ports:
      - "${ART_BIND:-127.0.0.1}:${ART_HTTP_PORT:-8088}:80"
      - "${ART_BIND:-127.0.0.1}:${ART_HTTPS_PORT:-8443}:443"
      - "${ART_BIND6:-[::1]}:${ART_HTTP_PORT:-8088}:80"
      - "${ART_BIND6:-[::1]}:${ART_HTTPS_PORT:-8443}:443"
    networks:
      edge: {}
      proxy:
        ipv4_address: ${ART_PROXY_NET:-172.30.80}.2
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    tmpfs: ["/tmp:size=16m,mode=1777"]
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.5
    # Ports below 1024 are unprivileged only within this container namespace.
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 4s
      retries: 3
      start_period: 10s

  web:
    <<: *common
    image: ${ART_APP_IMAGE:-singular-seed-app:development}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: app
      args:
        REVISION: ${ART_REVISION:-development}
    environment:
      ART_ORIGIN: ${ART_ORIGIN:?Set the canonical browser origin}
      ART_ADDR: 0.0.0.0:8080
      ART_ADMIN_ADDR: 127.0.0.1:8081
      ART_TRUSTED_PROXY: ${ART_PROXY_NET:-172.30.80}.2
      ART_SOCKET: /run/art/renderer.sock
      ART_CACHE: /var/cache/art
      ART_GENERATION: ${ART_GENERATION:-on}
      ART_LOG_LEVEL: ${ART_LOG_LEVEL:-info}
    networks:
      proxy:
        ipv4_address: ${ART_PROXY_NET:-172.30.80}.3
    volumes:
      - socket:/run/art:ro
      - cache:/var/cache/art
    tmpfs: ["/tmp:size=16m,mode=1777"]
    mem_limit: 384m
    memswap_limit: 384m
    cpus: 0.5
    stop_grace_period: 45s
    healthcheck:
      test: [CMD, /app/artctl, live]
      interval: 10s
      timeout: 4s
      retries: 3
      start_period: 10s

  renderer:
    <<: *common
    image: ${ART_APP_IMAGE:-singular-seed-app:development}
    entrypoint: [/app/artrender]
    user: "10002:10000"
    network_mode: none
    environment:
      ART_SOCKET: /run/art/renderer.sock
      GOMAXPROCS: "2"
      ART_LOG_LEVEL: ${ART_LOG_LEVEL:-info}
    volumes:
      - socket:/run/art
    tmpfs: ["/tmp:size=16m,mode=1777"]
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 1.5
    stop_grace_period: 10s
    healthcheck:
      test: [CMD, /app/artctl, renderer-ready]
      interval: 10s
      timeout: 4s
      retries: 3
      start_period: 10s

networks:
  edge: {}
  proxy:
    internal: true
    ipam:
      config:
        - subnet: ${ART_PROXY_NET:-172.30.80}.0/29

volumes:
  socket: {}
  cache: {}
  caddy_data: {}
  caddy_config: {}
