# River coordinates durable jobs through the separately managed PostgreSQL service.
x-limits: &limits
  ART_LIMITS_PROFILE: ${ART_LIMITS_PROFILE:-production}
  ART_LIMITS_JSON: ${ART_LIMITS_JSON:-}
x-common: &common
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 64
  logging:
    driver: local
    options:
      max-size: "10m"
      max-file: "3"

services:
  caddy:
    <<: *common
    image: ${ART_EDGE_IMAGE:-singular-seed-edge:development}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: edge
      args:
        REVISION: ${ART_REVISION:-development}
    environment:
      ART_DOMAIN: ${ART_DOMAIN:?Set the canonical Caddy site address}
    ports:
      - "${ART_BIND:-127.0.0.1}:${ART_HTTP_PORT:-8088}:80"
      - "${ART_BIND:-127.0.0.1}:${ART_HTTPS_PORT:-8443}:443"
      - "${ART_BIND6:-[::1]}:${ART_HTTP_PORT:-8088}:80"
      - "${ART_BIND6:-[::1]}:${ART_HTTPS_PORT:-8443}:443"
    networks:
      edge: {}
      proxy:
        ipv4_address: ${ART_PROXY_NET:-172.30.80}.2
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    tmpfs: ["/tmp:size=16m,mode=1777"]
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.5
    # Ports below 1024 are unprivileged only within this container namespace.
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 4s
      retries: 3
      start_period: 10s

  web:
    <<: *common
    image: ${ART_APP_IMAGE:-singular-seed-app:development}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: app
      args:
        REVISION: ${ART_REVISION:-development}
    environment:
      ART_ORIGIN: ${ART_ORIGIN:?Set the canonical browser origin}
      <<: *limits
      ART_ADDR: 0.0.0.0:8080
      ART_ADMIN_ADDR: 127.0.0.1:8081
      ART_TRUSTED_PROXY: ${ART_PROXY_NET:-172.30.80}.2
      ART_DATABASE_URL_FILE: /run/secrets/web-database
      ART_S3_CREDENTIALS_FILE: /run/secrets/web-objects
      ART_S3_ENDPOINT: ${ART_S3_ENDPOINT:?Configure private object storage}
      ART_S3_REGION: ${ART_S3_REGION:?Set bucket region}
      ART_S3_BUCKET: ${ART_S3_BUCKET:?Set image bucket}
      ART_S3_PREFIX: ${ART_S3_PREFIX:-artifacts}
      ART_S3_LOCAL: ${ART_S3_LOCAL:-false}
      ART_LOG_LEVEL: ${ART_LOG_LEVEL:-info}
    networks:
      proxy:
        ipv4_address: ${ART_PROXY_NET:-172.30.80}.3
      database: {}
      egress: {}
    secrets: [web-database, web-objects]
    tmpfs: ["/tmp:size=16m,mode=1777"]
    mem_limit: 384m
    memswap_limit: 384m
    cpus: 0.5
    stop_grace_period: 45s
    healthcheck:
      test: [CMD, /app/artctl, live]
      interval: 10s
      timeout: 4s
      retries: 3
      start_period: 10s

  renderer:
    <<: *common
    image: ${ART_APP_IMAGE:-singular-seed-app:development}
    entrypoint: [/app/artrender]
    user: "10002:10000"
    networks: [database, egress]
    environment:
      ART_DATABASE_URL_FILE: /run/secrets/renderer-database
      <<: *limits
      ART_S3_CREDENTIALS_FILE: /run/secrets/renderer-objects
      ART_S3_ENDPOINT: ${ART_S3_ENDPOINT:?Configure private object storage}
      ART_S3_REGION: ${ART_S3_REGION:?Set bucket region}
      ART_S3_BUCKET: ${ART_S3_BUCKET:?Set image bucket}
      ART_S3_PREFIX: ${ART_S3_PREFIX:-artifacts}
      ART_S3_LOCAL: ${ART_S3_LOCAL:-false}
      GOMAXPROCS: "2"
      ART_LOG_LEVEL: ${ART_LOG_LEVEL:-info}
    secrets: [renderer-database, renderer-objects]
    tmpfs: ["/tmp:size=16m,mode=1777"]
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 1.5
    stop_grace_period: 100s
    healthcheck:
      test: [CMD, /app/artctl, renderer-live]
      interval: 10s
      timeout: 4s
      retries: 3
      start_period: 10s

networks:
  database:
    external: true
    name: ${ART_DATABASE_NETWORK:-singular-seed-data_default}
  egress: {}
  edge: {}
  proxy:
    internal: true
    ipam:
      config:
        - subnet: ${ART_PROXY_NET:-172.30.80}.0/29

volumes:
  caddy_data: {}
  caddy_config: {}

secrets:
  web-database:
    file: ${ART_SECRETS_DIR:-/etc/art/secrets}/web-database
  renderer-database:
    file: ${ART_SECRETS_DIR:-/etc/art/secrets}/renderer-database
  web-objects:
    file: ${ART_SECRETS_DIR:-/etc/art/secrets}/web-objects
  renderer-objects:
    file: ${ART_SECRETS_DIR:-/etc/art/secrets}/renderer-objects
