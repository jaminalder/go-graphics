#cloud-config
package_update: true
packages: [ca-certificates, curl, ufw, unattended-upgrades]
ssh_pwauth: false
disable_root: true
users:
  - name: operator
    # Ubuntu already has this group; avoid useradd trying to create it again.
    primary_group: operator
    groups: [sudo]
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    ssh_authorized_keys:
      - ${ssh_public_key}
write_files:
  - path: /usr/local/sbin/art-bootstrap-host
    permissions: '0700'
    encoding: b64
    content: ${bootstrap_host}
  - path: /usr/local/sbin/art-install-release
    permissions: '0700'
    encoding: b64
    content: ${install_release}
  - path: /etc/art/admin-cidrs.json
    permissions: '0600'
    content: '${admin_cidrs}'
  - path: /etc/ssh/sshd_config.d/50-art.conf
    content: |
      PasswordAuthentication no
      PermitRootLogin no
  - path: /etc/systemd/journald.conf.d/art.conf
    content: |
      [Journal]
      SystemMaxUse=256M
      MaxRetentionSec=7day
  - path: /etc/apt/apt.conf.d/52-art-updates
    content: |
      Unattended-Upgrade::Automatic-Reboot "false";
runcmd:
  - [/usr/local/sbin/art-bootstrap-host]
