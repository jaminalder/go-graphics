#cloud-config
package_update: true
packages: [ca-certificates, curl, ufw, unattended-upgrades]
ssh_pwauth: false
disable_root: true
users:
  - name: operator
    # Ubuntu already has this group; avoid useradd trying to create it again.
    primary_group: operator
    groups: [sudo]
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    ssh_authorized_keys:
      - ${ssh_public_key}
write_files:
  - path: /etc/ssh/sshd_config.d/50-art.conf
    content: |
      PasswordAuthentication no
      PermitRootLogin no
  - path: /etc/systemd/journald.conf.d/art.conf
    content: |
      [Journal]
      SystemMaxUse=256M
      MaxRetentionSec=7day
  - path: /etc/apt/apt.conf.d/52-art-updates
    content: |
      Unattended-Upgrade::Automatic-Reboot "false";
runcmd:
  - [install, -d, -m, '0755', /opt/art/releases, /etc/art]
  - [ufw, default, deny, incoming]
  - [ufw, allow, '80/tcp']
  - [ufw, allow, '443/tcp']
  # SSH UFW allow rules and enable are owner steps after confirming cloud firewall
  # and console recovery. Do not risk locking the administrator out in bootstrap.
