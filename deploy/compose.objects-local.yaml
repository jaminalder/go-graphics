# Disposable emulator only; production uses managed Hetzner Object Storage.
services:
  objects:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data
    environment:
      MINIO_ROOT_USER: disposable-local
      MINIO_ROOT_PASSWORD: disposable-local-password
    volumes: [objects_data:/data]
volumes:
  objects_data: {}
