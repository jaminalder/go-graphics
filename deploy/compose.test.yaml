name: art-persistence-test
services:
  postgres:
    image: postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_USER: art
      POSTGRES_PASSWORD: disposable-test-password
      POSTGRES_DB: art_test
    command: [postgres, -c, shared_preload_libraries=pg_stat_statements, -c, pg_stat_statements.track=all]
    ports: ["127.0.0.1:15439:5432"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U art -d art_test"]
      interval: 2s
      timeout: 2s
      retries: 30
    tmpfs: [/var/lib/postgresql/data]
  objects:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data
    environment:
      MINIO_ROOT_USER: disposable-test
      MINIO_ROOT_PASSWORD: disposable-test-password
    ports: ["127.0.0.1:19009:9000"]
    tmpfs: [/data]
