name: Check artwork and public studio
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.8'
          cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.11.1'
      - name: Install pinned Go verification tools
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      - run: make check
      - run: go test -race ./internal/artwork ./internal/explore ./internal/publish ./internal/renderjob ./internal/studio ./internal/web ./cmd/staticart
      - run: govulncheck ./...
      - name: Real browser journeys and failure recovery
        working-directory: web/browser
        run: |
          npm ci --ignore-scripts --registry=https://registry.npmjs.org
          npx playwright install --with-deps chromium
          npm test
      - name: Build immutable Linux ARM64 release
        run: deploy/scripts/build-release.sh
      - name: Exercise activation and rollback failure paths
        run: python3 deploy/tests/test_activation.py
      - name: Check deployment shell syntax
        run: for script in deploy/scripts/*.sh; do bash -n "$script"; done

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: '1.14.9'
          terraform_wrapper: false
      - name: Validate infrastructure without cloud credentials
        run: |
          terraform -chdir=deploy/terraform fmt -check
          terraform -chdir=deploy/terraform init -backend=false -input=false
          terraform -chdir=deploy/terraform validate
      - name: Verify Compose isolation and real rendering
        run: deploy/scripts/verify-compose.sh
